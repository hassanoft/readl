name: readl
description: "READL — Vos PDF, votre voix. Importez, lisez et écoutez vos documents PDF."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.10.0 <4.0.0'
  # CardThemeData (utilisé dans core/theme/app_theme.dart) n'existe comme
  # type de ThemeData.cardTheme qu'à partir de Flutter 3.32.
  flutter: '>=3.38.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State management
  flutter_riverpod: ^2.6.1

  # Navigation
  go_router: ^14.8.1

  # Backend (auth, database, storage)
  supabase_flutter: ^2.17.2

  # Local persistence (onboarding flag, reading preferences)
  shared_preferences: ^2.3.3
  path_provider: ^2.1.5
  file_picker: ^12.3.0
  flutter_tts: ^4.2.5
  syncfusion_flutter_pdf: ^34.2.7
  syncfusion_flutter_pdfviewer: ^34.2.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true
  assets:
    - assets/images/

# Configuration pour générer les icônes Android/iOS à partir du logo READL.
# Commande à exécuter après `flutter pub get` :
#   dart run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: "assets/icon/app_icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#FFFFFFFF"
  adaptive_icon_foreground: "assets/icon/app_icon_foreground.png"
